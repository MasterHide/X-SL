{{define "commonSider"}}
<!-- Desktop Collapsible Sidebar -->
<a-layout-sider id="xsl-sider" v-model="sidebar.collapsed" :trigger="null" collapsible :width="240" :collapsedWidth="80">
      <div class="xsl-sider-header">
    <img src="{{ .base_path }}assets/xsl/img/logo.png" alt="X-SL Logo" class="xsl-logo-img" />
  </div>

  <a-menu id="xsl-menu" mode="inline" theme="dark" :selected-keys="['{{ .request_uri }}']" @click="({key}) => key.startsWith('http') ? window.open(key) : location.href = key">
    {{template "menuItems" .}}
  </a-menu>

  <!-- Custom Collapse Trigger at Bottom -->
  <div class="xsl-sider-trigger" @click="sidebar.toggle()">
    <iconify-icon :icon="sidebar.collapsed ? 'mdi:chevron-double-right' : 'mdi:chevron-double-left'" width="20" class="xsl-trigger-icon"></iconify-icon>
    <span class="xsl-trigger-text" v-show="!sidebar.collapsed">Collapse</span>
  </div>
</a-layout-sider>

<!-- Mobile Floating Button -->
<a-button id="xsl-mobile-trigger" type="primary" shape="circle" @click="siderDrawer.change()">
  <iconify-icon icon="mdi:menu" width="24"></iconify-icon>
</a-button>

<!-- Mobile Drawer Menu -->
<a-drawer id="xsl-sider-drawer" placement="left" :closable="false" @close="siderDrawer.close()" :visible="siderDrawer.visible" width="240px" :body-style="{ padding: '0', background: '#1e293b' }">
    <div class="xsl-sider-header">
    <img src="{{ .base_path }}assets/xsl/img/logo.png" alt="X-SL Logo" class="xsl-logo-img" />
  </div>
  <a-menu id="xsl-menu" mode="inline" theme="dark" :selected-keys="['{{ .request_uri }}']" @click="({key}) => { key.startsWith('http') ? window.open(key) : location.href = key; siderDrawer.close(); }">
    {{template "menuItems" .}}
  </a-menu>
</a-drawer>

<script>
  const siderDrawer = {
    visible: false,
    show() { this.visible = true; },
    close() { this.visible = false; },
    change() { this.visible = !this.visible; },
  };
  const sidebar = {
    collapsed: false, // Set to true if you want it to start collapsed
    toggle() { this.collapsed = !this.collapsed; }
  };
</script>
{{end}}
