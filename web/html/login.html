<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<style>
  :root {
    --xsl-primary: #6366f1;
    --xsl-primary-hover: #4f46e5;
    --xsl-bg: #0f172a;
    --xsl-bg-secondary: #1e293b;
    --xsl-card: rgba(30, 41, 59, 0.7);
    --xsl-border: rgba(255, 255, 255, 0.1);
    --xsl-text: #f1f5f9;
    --xsl-text-muted: #94a3b8;
  }

  html * {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background-color: var(--xsl-bg) !important;
    font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    overflow: hidden;
  }

  h1 {
    text-align: center;
    height: 40px;
    margin-bottom: 32px;
  }

  /* Glassmorphism Login Card */
  #login {
    animation: charge 0.6s both;
    background: var(--xsl-card) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
    border: 1px solid var(--xsl-border) !important;
    border-radius: 24px !important;
    padding: 48px 40px !important;
    transition: all 0.3s ease;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select: none;
    max-width: 440px; /* Keeps the card compact and centered */
    width: 100% !important;
    margin: 0 auto !important;
  }
  @keyframes charge {
    from { transform: translateY(2rem); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* Title Animation - Now Pure White */
  .title {
    font-size: 32px;
    font-weight: 700;
    color: #ffffff !important;
    background: none !important;
    -webkit-text-fill-color: #ffffff !important;
  }
  .title b { font-weight: 700 !important; }
  .words-wrapper { width: 100%; display: inline-block; position: relative; text-align: center; }
  .words-wrapper b { width: 100%; display: inline-block; position: absolute; left: 0; top: 0; }
  .words-wrapper b.is-visible { position: relative; }
  .headline.zoom .words-wrapper { -webkit-perspective: 300px; perspective: 300px; }
  .headline { display: flex; justify-content: center; align-items: center; }
  .headline.zoom b { opacity: 0; }
  .headline.zoom b.is-visible { opacity: 1; -webkit-animation: zoom-in 0.8s; animation: cubic-bezier(0.215, 0.610, 0.355, 1.000) zoom-in 0.8s; }
  .headline.zoom b.is-hidden { -webkit-animation: zoom-out 0.8s; animation: cubic-bezier(0.215, 0.610, 0.355, 1.000) zoom-out 0.4s; }
  @keyframes zoom-in { 0% { opacity: 0; transform: translateZ(100px); } 100% { opacity: 1; transform: translateZ(0); } }
  @keyframes zoom-out { 0% { opacity: 1; transform: translateZ(0); } 100% { opacity: 0; transform: translateZ(-100px); } }

  /* Background Waves */
  .under {
    background-color: var(--xsl-bg) !important;
    z-index: 0;
    position: relative;
    overflow: hidden;
  }
  .waves-header {
    position: absolute; top: 0; left: 0; width: 100%; text-align: center; z-index: 0;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
  }
  .waves-inner-header { height: 50vh; width: 100%; margin: 0; padding: 0; }
  .waves { position: absolute; bottom: 0; width: 100%; height: 15vh; margin-bottom: -8px; min-height: 100px; max-height: 150px; }
  .parallax > use { animation: move-forever 25s cubic-bezier(0.55, 0.5, 0.45, 0.5) infinite; }
  .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 4s; opacity: 0.2; }
  .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 7s; opacity: 0.3; }
  .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 10s; opacity: 0.4; }
  .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 13s; }
  @keyframes move-forever { 0% { transform: translate3d(-90px, 0, 0); } 100% { transform: translate3d(85px, 0, 0); } }

  /* Premium Inputs (No Icons, Strict Dark Background, No White Hover) */
  .ant-form-item { margin-bottom: 24px; }
  
  .ant-input-wrapper.ant-input-group {
    display: flex !important;
    align-items: stretch !important;
    width: 100% !important;
  }
  
  /* Main Input Container - Forced Dark */
  .ant-input-affix-wrapper,
  .ant-input {
    background-color: #1e293b !important;
    border: 1px solid var(--xsl-border) !important;
    border-radius: 12px !important;
    height: 50px !important;
    padding: 0 20px !important; 
    transition: border-color 0.3s ease !important;
    box-shadow: none !important;
    color: var(--xsl-text) !important;
    font-size: 15px !important;
  }
  
  /* Remove White Hover Completely */
  .ant-input-affix-wrapper:hover,
  .ant-input:hover {
    background-color: #1e293b !important;
    border-color: rgba(99, 102, 241, 0.5) !important;
  }
  
  /* Focus State */
  .ant-input-affix-wrapper-focused,
  .ant-input-focused { 
    background-color: #1e293b !important;
    border-color: var(--xsl-primary) !important; 
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15) !important; 
  }
  
  .ant-input::placeholder { color: var(--xsl-text-muted) !important; }
  
  /* Webkit Autofill Fix (Stops white background when selecting saved passwords) */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: #f1f5f9 !important;
    caret-color: #f1f5f9 !important;
    -webkit-box-shadow: 0 0 0 1000px #1e293b inset !important;
    transition: background-color 5000s ease-in-out 0s;
  }
  
  /* Fix Password Component Addon (Eye Icon Container) */
  .ant-input-group-addon {
    background-color: #1e293b !important;
    border: 1px solid var(--xsl-border) !important;
    border-left: none !important;
    border-radius: 0 12px 12px 0 !important;
    color: var(--xsl-text-muted) !important;
    padding: 0 16px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    height: 50px !important;
  }
  .ant-input-group-addon .anticon {
    color: var(--xsl-text-muted) !important;
    font-size: 16px !important;
    margin: 0 !important;
  }
  .ant-input-group-addon .anticon:hover {
    color: var(--xsl-primary) !important;
  }
  
  .ant-input-group .ant-input-affix-wrapper {
    border-radius: 12px 0 0 12px !important;
  }

  /* Remove default browser outlines */
  .ant-input:focus, .ant-btn:focus, .ant-select:focus, .ant-select-selection:focus {
    outline: none !important;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15) !important;
  }

  /* Centering */
  .centered { display: flex; text-align: center; align-items: center; justify-content: center; width: 100%; }

  /* Premium Login Button Alignment */
  .wave-btn-bg {
    position: relative; width: 100%; transition: all 0.3s ease;
    display: flex !important; justify-content: center !important;
  }
  .ant-btn-primary-login {
    width: 100% !important; height: 50px !important; border-radius: 12px !important;
    font-weight: 600 !important; font-size: 16px !important; letter-spacing: 0.5px !important;
    background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%) !important;
    border: none !important; color: #fff !important;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4) !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    display: flex !important; align-items: center !important; justify-content: center !important;
  }
  .ant-btn-primary-login:hover {
    background: linear-gradient(135deg, #818cf8 0%, #8b5cf6 100%) !important;
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6) !important;
    transform: translateY(-2px) !important;
  }
  .ant-btn-primary-login:active { transform: translateY(0) !important; }

  /* Language Select Alignment */
  .ant-select { width: 100% !important; }
  .ant-select-selection {
    background-color: #1e293b !important;
    border: 1px solid var(--xsl-border) !important; border-radius: 12px !important;
    color: var(--xsl-text) !important; height: 50px !important;
    display: flex !important; align-items: center !important; box-shadow: none !important;
  }
  .ant-select-selection:hover { border-color: rgba(99, 102, 241, 0.5) !important; }
  .ant-select-selection__rendered {
    margin: 0 !important; padding: 0 16px !important; height: 100% !important;
    display: flex !important; align-items: center !important; line-height: 50px !important;
  }
  .ant-select-arrow { color: var(--xsl-text-muted) !important; right: 16px !important; }
  
  /* Mobile Responsiveness */
  @media (max-width: 576px) {
    #login {
      padding: 32px 24px !important;
    }
  }
</style>
<body>
  <a-layout id="app" v-cloak :class="themeSwitcher.currentTheme">
    <transition name="list" appear>
      <a-layout-content class="under" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;">
        
        <!-- Animated Background Waves -->
        <div class="waves-header">
          <div class="waves-inner-header"></div>
          <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
               viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
              <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
              <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(99, 102, 241, 0.15)" />
              <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(124, 58, 237, 0.15)" />
              <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(30, 41, 59, 0.4)" />
              <use xlink:href="#gentle-wave" x="48" y="7" fill="#0f172a" />
            </g>
          </svg>
        </div>

        <!-- Login Card -->
        <a-row type="flex" justify="center" align="middle" style="width: 100%; position: relative; z-index: 1; padding: 24px;">
          <a-col :xs="22" :sm="20" :md="14" :lg="10" :xl="8" :xxl="6" id="login">
            
            <!-- Responsive Logo -->
            <a-row type="flex" justify="center">
              <a-col style="width: 100%; text-align: center; margin-bottom: 16px;">
                <img src="{{ .base_path }}assets/xsl/img/logo.png" alt="Xray SL Logo" style="max-width: 500px; width: 100%; height: auto; margin: 0 auto 24px; display: block; filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.3));" />
              </a-col>
            </a-row>
            
            <!-- Wellcome Text -->
            <a-row type="flex" justify="center">
              <a-col style="width: 100%;">
                <h1 class="title headline zoom" style="font-size: 32px; height: 40px; margin-bottom: 32px;">
                  <span class="words-wrapper">
                    <b class="is-visible">Wellcome</b>
                  </span>
                </h1>
              </a-col>
            </a-row>

            <!-- Login Form -->
            <a-row type="flex" justify="center">
              <a-col span="24">
                <a-form>
                  <a-form-item>
                    <a-input autocomplete="username" name="username" v-model.trim="user.username" placeholder='{{ i18n "username" }}'
                             @keydown.enter.native="login" autofocus>
                    </a-input>
                  </a-form-item>
                  <a-form-item>
                    <password-input autocomplete="password" name="password" v-model.trim="user.password"
                                    placeholder='{{ i18n "password" }}'
                                    @keydown.enter.native="login">
                    </password-input>
                  </a-form-item>
                  <a-form-item v-if="secretEnable">
                    <password-input autocomplete="secret" name="secret" v-model.trim="user.loginSecret"
                                    placeholder='{{ i18n "secretToken" }}'
                                    @keydown.enter.native="login">
                    </password-input>
                  </a-form-item>
                  <a-form-item>
                    <a-row justify="center" class="centered">
                      <div class="wave-btn-bg" :style="loading ? { width: '52px' } : { width: '100%' }">
                        <a-button class="ant-btn-primary-login" type="primary"
                                  :loading="loading" @click="login"
                                  :icon="loading ? 'poweroff' : undefined">
                                  [[ loading ? '' : '{{ i18n "login" }}' ]]
                        </a-button>
                      </div>
                    </a-row>
                  </a-form-item>
                  <a-form-item>
                    <a-row justify="center" class="centered" style="margin-top: 8px;">
                      <a-col :span="24" style="text-align: center;">
                        <a-select ref="selectLang" v-model="lang"
                                  @change="setLang(lang)"
                                  :dropdown-class-name="themeSwitcher.currentTheme">
                          <a-select-option :value="l.value" label="English" v-for="l in supportLangs">
                            <span role="img" aria-label="l.name" v-text="l.icon"></span>
                            &nbsp;&nbsp;<span v-text="l.name"></span>
                          </a-select-option>
                        </a-select>
                      </a-col>
                    </a-row>
                  </a-form-item>
                  <a-form-item>
                    <a-row justify="center" class="centered">
                      <theme-switch-login></theme-switch-login>
                    </a-row>
                  </a-form-item>
                </a-form>
              </a-col>
            </a-row>
          </a-col>
        </a-row>
      </a-layout-content>
    </transition>
  </a-layout>
{{template "js" .}}
{{template "component/themeSwitcher" .}}
{{template "component/password" .}}
<script>
  class User {
    constructor() {
      this.username = "";
      this.password = "";
    }
  }
  const app = new Vue({
    delimiters: ['[[', ']]'],
    el: '#app',
    data: {
      themeSwitcher,
      loading: false,
      user: new User(),
      secretEnable: false,
      lang: ""
    },
    async created() {
      this.lang = getLang();
      this.secretEnable = await this.getSecretStatus();
    },
    methods: {
      async login() {
        this.loading = true;
        const msg = await HttpUtil.post('/login', this.user);
        this.loading = false;
        if (msg.success) {
          location.href = basePath + 'panel/';
        }
      },
      async getSecretStatus() {
        this.loading = true;
        const msg = await HttpUtil.post('/getSecretStatus');
        this.loading = false;
        if (msg.success) {
          this.secretEnable = msg.obj;
          return msg.obj;
        }
      },
    },
  });
  document.addEventListener("DOMContentLoaded", function() {
    var animationDelay = 2000;
    initHeadline();

    function initHeadline() {
      animateHeadline(document.querySelectorAll('.headline'));
    }

    function animateHeadline(headlines) {
      var duration = animationDelay;
      headlines.forEach(function(headline) {
        setTimeout(function() {
          hideWord(headline.querySelector('.is-visible'));
        }, duration);
      });
    }

    function hideWord(word) {
      var nextWord = takeNext(word);
      switchWord(word, nextWord);
      setTimeout(function() {
        hideWord(nextWord);
      }, animationDelay);
    }

    function takeNext(word) {
      return (word.nextElementSibling) ? word.nextElementSibling : word.parentElement.firstElementChild;
    }

    function switchWord(oldWord, newWord) {
      oldWord.classList.remove('is-visible');
      oldWord.classList.add('is-hidden');
      newWord.classList.remove('is-hidden');
      newWord.classList.add('is-visible');
    }
  });
</script>
</body>
</html>
